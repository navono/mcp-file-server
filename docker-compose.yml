services:
  mcp-file-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    image: mcp-file-server:latest
    container_name: mcp-file-server
    ports:
      - "8001:8001"  # Map port 8001 for streaming HTTP transport
    volumes:
      - /mnt/c/Users/supcon/Downloads:/data/Downloads
      - /mnt/e/OneDrive/eBooks:/data/eBooks
      - /mnt/d/sourcecode:/data/sourcecode
      - /mnt/e/data/ComfyUI/input:/data/ComfyUI/input
    restart: unless-stopped
    stdin_open: true # Keep stdin open for the stdio transport
    tty: true # Allocate a pseudo-TTY
    command: ["uv", "run", "python", "streaming_server.py"]  # Use streaming server for HTTP transport